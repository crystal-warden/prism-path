#
# GovernedAgent: one object per member. spec.parent names the parent member, and the object carries an
# ownerReference to the parent's object, so a foreground delete of a member removes its subtree. The schema
# types the fields but enumerates no values: a request for the authority key or a right the parent lacks
# must reach the webhook, be decided and be receipted, not be turned away by the schema unrecorded.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: governedagents.population.prismpath.dev
spec:
  group: population.prismpath.dev
  scope: Namespaced
  names:
    plural: governedagents
    singular: governedagent
    kind: GovernedAgent
    listKind: GovernedAgentList
    shortNames: [gagent]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Parent
          type: string
          jsonPath: .spec.parent
        - name: Rights
          type: string
          jsonPath: .spec.rights
        - name: Version
          type: string
          jsonPath: .spec.version.name
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [parent, rights, version]
              properties:
                parent:
                  type: string
                  maxLength: 63
                  description: the parent member's name; empty for a root, which only the operator founds
                rights:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    maxLength: 32
                  description: write, exec, replicate; reading is everyone's
                key:
                  type: string
                  maxLength: 32
                  description: the key the member asks to hold; only "instance", a fresh key the controller makes, is admitted
                version:
                  type: object
                  required: [format, name, system_message, policy_ref, tools, behaviour]
                  properties:
                    format:
                      type: string
                      maxLength: 64
                    name:
                      type: string
                      maxLength: 64
                    system_message:
                      type: string
                      maxLength: 8192
                    policy_ref:
                      type: string
                      maxLength: 64
                      description: the sha256 of the harness image the member runs under
                    tools:
                      type: array
                      maxItems: 8
                      items:
                        type: string
                        maxLength: 32
                    behaviour:
                      type: string
                      maxLength: 64
                evaluation:
                  type: string
                  maxLength: 63
                  description: the name of a sealed evaluation run in the webhook's store, for an evolution
                protect:
                  type: boolean
                  description: always refused (121); present so that the request is decided and receipted
                restarts:
                  type: integer
                  minimum: 0
                  description: raised by the controller to restart a crashed member
            status:
              type: object
              properties:
                generation:
                  type: integer
                lineage:
                  type: string
                phase:
                  type: string
