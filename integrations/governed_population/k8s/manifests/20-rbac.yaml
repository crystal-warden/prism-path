#
# Who may write what. Every GovernedAgent write a member or the controller makes is decided by the webhook;
# RBAC only keeps everything else out of reach. Members may write GovernedAgents and nothing else: no pods,
# secrets, PodDisruptionBudgets, roles or webhook configurations. The webhook reads GovernedAgents only.
# The operator is the cluster admin (group system:masters) and needs nothing here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: population-webhook
  namespace: prismpath-population-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: population-controller
  namespace: prismpath-population-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: population-webhook-reader
  namespace: prismpath-population
rules:
  - apiGroups: [population.prismpath.dev]
    resources: [governedagents]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: population-webhook-reader
  namespace: prismpath-population
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: population-webhook-reader
subjects:
  - kind: ServiceAccount
    name: population-webhook
    namespace: prismpath-population-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: population-member
  namespace: prismpath-population
rules:
  - apiGroups: [population.prismpath.dev]
    resources: [governedagents]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: population-member
  namespace: prismpath-population
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: population-member
subjects:
  - kind: Group
    name: system:serviceaccounts:prismpath-population
    apiGroup: rbac.authorization.k8s.io
---
# The controller (not built yet): restarts and stops members, runs their pods and makes their instance keys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: population-controller
  namespace: prismpath-population
rules:
  - apiGroups: [population.prismpath.dev]
    resources: [governedagents]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [population.prismpath.dev]
    resources: [governedagents/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, secrets, serviceaccounts]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: population-controller
  namespace: prismpath-population
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: population-controller
subjects:
  - kind: ServiceAccount
    name: population-controller
    namespace: prismpath-population-system
