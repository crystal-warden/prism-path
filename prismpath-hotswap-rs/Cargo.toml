[package]
name = "prismpath-hotswap-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native port of the PrismPath secure policy hot-swap: Ed25519-signed packs, envelope-bounded image validation, and the atomic, audited PolicyHost — cross-verified against the Python reference (a pack signed on either runtime verifies on the other)."
license = "Apache-2.0"

[dependencies]
prismpath-rs = { path = "../prismpath-rs", version = "0.1.0", features = ["durable"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"

[dev-dependencies]
base64 = "0.22"
