name: publish

# Generated by tools/export_clean.py in crystal-warden/prism-path from
# tools/mirror_publish.yml. Do not hand-edit here; edit the source and re-export.
#
# Publishes to PyPI through Trusted Publishing (OIDC), with no stored token. Run it by hand
# (Actions, publish, Run workflow) and choose the release tag as the ref. The publish job waits
# for the required reviewer on the `pypi` environment before anything is uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Require a release tag that matches the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ]; then
            echo "Run this workflow on the tag v$version (got $REF_TYPE $REF_NAME)." >&2
            exit 1
          fi
      - name: Install the build tools
        run: python -m pip install build twine
      - name: Build the sdist, then the wheel from it
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python -m build --outdir dist .
      - name: Check the metadata and the README render
        run: python -m twine check --strict dist/*
      - name: Record the SHA-256 of each file
        run: |
          cd dist
          sha256sum -- * | tee SHA256SUMS
          {
            echo "### SHA-256 of the built files"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
