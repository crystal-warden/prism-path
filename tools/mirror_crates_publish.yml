name: publish-crates

# Generated by tools/export_clean.py in crystal-warden/prism-path from
# tools/mirror_crates_publish.yml. Do not hand-edit here; edit the source and re-export.
#
# Publishes the four Rust crates to crates.io through Trusted Publishing (OIDC), with no stored token.
# Run it by hand (Actions, publish-crates, Run workflow) and choose the release tag as the ref. The tag is
# the same v<version> tag as the PyPI release, the version in pyproject.toml, so one tag names one release of
# the whole product. The crates keep their own versions, which are checked below. The publish job waits for
# the required reviewer on the `crates-io` environment before anything is uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Dependency order: each crate depends only on the ones before it.
  CRATES: prismpath-rs prismpath-telemetry-rs prismpath-hotswap-rs prismpath-preflight

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Require a release tag that matches the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ]; then
            echo "Run this workflow on the tag v$version (got $REF_TYPE $REF_NAME)." >&2
            exit 1
          fi
      - name: Require that no crate version is already on crates.io
        run: |
          status=0
          for crate in $CRATES; do
            version=$(cargo metadata --format-version 1 --no-deps --locked \
              | python -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
            path="${crate:0:2}/${crate:2:2}/$crate"
            code=$(curl -s -o index.txt -w '%{http_code}' "https://index.crates.io/$path")
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "The crates.io index answered $code for $crate, so it is not known whether $version is published." >&2
              status=1
            elif [ "$code" = "200" ] && grep -q "\"vers\":\"$version\"" index.txt; then
              echo "$crate $version is already on crates.io. Raise its version before tagging." >&2
              status=1
            else
              echo "$crate $version is not on crates.io yet (index answered $code)."
            fi
          done
          exit $status
      - name: List the files each crate packages
        run: |
          for crate in $CRATES; do
            echo "== $crate"
            cargo package --list --locked -p "$crate"
          done
      - name: Dry run the publish of every crate, in dependency order
        # A crate whose dependency is not on crates.io yet cannot be dry run alone. The workspace form
        # packages them in dependency order and checks each against the ones before it.
        run: cargo publish --workspace --dry-run --locked

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get a short lived crates.io token through Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish each crate, in dependency order, and wait for the index
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in $CRATES; do
            version=$(cargo metadata --format-version 1 --no-deps --locked \
              | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
            echo "== publishing $crate $version"
            cargo publish --locked -p "$crate"
            path="${crate:0:2}/${crate:2:2}/$crate"
            for attempt in $(seq 1 30); do
              if curl -s "https://index.crates.io/$path" | grep -q "\"vers\":\"$version\""; then
                echo "$crate $version is in the index."
                break
              fi
              if [ "$attempt" = 30 ]; then
                echo "$crate $version did not reach the index in 5 minutes." >&2
                exit 1
              fi
              sleep 10
            done
          done
