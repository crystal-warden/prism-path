# Native (Python-free) PrismPath crates: the kernel, the Facet telemetry wire, the policy hot swap and the
# preflight tool, held to the Python reference by the frozen corpora and the cross language tests.
# prismpath-rs/CONFORMANCE.md has the certified counts and DIVERGENCES.md lists where they answer
# differently on purpose. Lockfile and minimum version policy: docs/design/rust-lockfiles.md.
[workspace]
resolver = "2"
members = [
    "prismpath-rs",
    "prismpath-telemetry-rs",
    "prismpath-hotswap-rs",
    "prismpath-preflight",
]
