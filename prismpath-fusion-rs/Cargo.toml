[package]
name = "prismpath-fusion-rs"
version = "0.1.0"
edition = "2021"
description = "Native port of the PrismPath cyber-physical fusion adapter's runtime: field projections + the fusion_triage tessellation, conformance-gated against the same frozen corpus the Python adapter passes."
license = "Apache-2.0"

[dependencies]
prismpath-rs = { path = "../prismpath-rs" }
prismpath-telemetry-rs = { path = "../prismpath-telemetry-rs" }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
