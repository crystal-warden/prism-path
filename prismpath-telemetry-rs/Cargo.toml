[package]
name = "prismpath-telemetry-rs"
version = "0.1.0"
edition = "2021"
description = "A faithful 1-1 Rust port of the Python telemetry adapter"

[dependencies]
prismpath-rs = { path = "../prismpath-rs" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
