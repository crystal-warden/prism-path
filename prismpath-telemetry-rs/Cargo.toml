[package]
name = "prismpath-telemetry-rs"
version = "0.1.0"
edition = "2021"
description = "Facet decision-telemetry wire for PrismPath: Figueroa quantization, Zeckendorf coding, and a self-healing Merkle transport."
license = "Apache-2.0"
repository = "https://github.com/crystal-warden/prism-path"
keywords = ["telemetry", "quantization", "policy", "merkle", "embedded"]
categories = ["encoding", "embedded"]

[dependencies]
prismpath-rs = { path = "../prismpath-rs", version = "0.1.0" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
