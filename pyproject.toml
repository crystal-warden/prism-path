[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismpath"
version = "0.1.0"
description = "One Markdown file is the workflow: a routing spectrum (deterministic predicates -> embeddings -> LLM-on-doubt) for LLM-agent workflows, plus a gated sprint control plane."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Crystal Warden Labs" }]
requires-python = ">=3.10"
keywords = ["llm", "agents", "workflow", "orchestration", "markdown", "routing", "declarative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "numpy",                   # required to import the CLI (routing/embedding math)
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers",   # the bge embedder — semantic routing, lockfile, calibrate, centroids,
]                              # lint's semantic checks. Lazy-loaded, so the CLI core installs without it.
control-plane = [
    "requests",                # served-model endpoints, wazuh adapter
    "fastapi",                 # orchestrator (SSE backend)
    "uvicorn",
    "pydantic",
]
llm-local = [
    "transformers",            # llm_local fallback router/agent
]
comparisons = [               # Area-5 head-to-head harness (prismpath/comparisons/) — reproduction only
    "langgraph", "langchain-openai", "crewai", "openai", "litellm",
]
test = ["pytest"]

[project.scripts]
prismpath = "prismpath.cli:main"

[tool.setuptools]
packages = [
    "prismpath",
    "prismpath.mission_control",   # the control plane's proving + observability command center
    "prismpath.plugins",
    "prismpath.plugins.council",
    "prismpath.tests",
]

[tool.setuptools.package-data]
# Everything here is READ AT RUNTIME by shipped code — not documentation. The prose docs live in
# the repo's top-level docs/ tree and ship via [tool.setuptools.data-files] below.
prismpath = ["flows/*.md",                    # example + reference flows
          "nudges/*.md",                      # prompt assets (orchestrator/run_sprint read these)
          "policies/*.md", "policies/*.json", # the guard's statutory floor + P1 lockfile
          "gallery/*.md", "gallery/*/*.md",   # `prismpath init --template` copies these
          "tests/fixtures/broken/*.md",       # the analyzer's broken-flow corpus (test_analysis)
          "*.html",
          "portable/*.mjs", "portable/*.html",
          "portable/conformance/*.json"]      # the frozen kernel spec
"prismpath.plugins.council" = ["*.md"]
# Mission Control's browser command center — served at runtime by the FastAPI app (control-plane extra).
"prismpath.mission_control" = ["static/*", "static/vendor/*"]

# Prose documentation, installed beside the package (sys.prefix/share/doc/prismpath/…) so an
# air-gapped install still carries it. Not importable — read these from the repo or GitHub normally.
#
# The layout MIRRORS THE REPO on purpose: root entry points at the top, everything else under
# docs/. Two reasons. (1) Flattening collides — README.md and docs/README.md would both land as
# share/doc/prismpath/README.md and one would silently win. (2) The relative links inside the docs
# (`../../SPEC.md` from docs/guides/, `../README.md` from docs/) only resolve if the depth is
# preserved; flattened, every cross-doc link in the installed tree would dangle.
[tool.setuptools.data-files]
"share/doc/prismpath" = ["README.md", "SPEC.md", "GETTING_STARTED.md", "ROADMAP.md"]
"share/doc/prismpath/docs" = ["docs/*.md"]          # index + decoder ring
"share/doc/prismpath/docs/guides" = ["docs/guides/*.md"]
"share/doc/prismpath/docs/design" = ["docs/design/*.md"]
"share/doc/prismpath/docs/research" = ["docs/research/*.md"]

[project.urls]
Repository = "https://github.com/crystal-warden/prism-path"
"Getting Started" = "https://github.com/crystal-warden/prism-path/blob/main/GETTING_STARTED.md"
Specification = "https://github.com/crystal-warden/prism-path/blob/main/SPEC.md"
Changelog = "https://github.com/crystal-warden/prism-path/blob/main/CHANGELOG.md"
Security = "https://github.com/crystal-warden/prism-path/blob/main/SECURITY.md"
