name = "fq"
defaultTargets = ["FQ", "Core", "core-oracle"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "FQ"

# The verified policy core (docs/design/spec-verified-core.md): the evaluator, its theorems and its
# bridge to FQ.
[[lean_lib]]
name = "Core"

# The oracle: the core's evaluator compiled to a program that reads canon/2 documents. It imports the
# evaluator only, not Mathlib, so it links small.
[[lean_exe]]
name = "core-oracle"
root = "Core.Main"
