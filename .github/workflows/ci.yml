name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The flow kernel needs only numpy at import time (sentence-transformers is lazy-loaded
      # inside the embedder and never touched by the test suite, which stubs all routing). So CI
      # stays fast and offline — no torch download — while still exercising the real code paths.
      # cryptography exercises the signing tier (policy packs); its tests importorskip so a
      # bare numpy+pytest environment still passes.
      - name: Install
        run: pip install numpy pytest cryptography
      - name: Unit tests (parser / predicates / router / engine / prefilter)
        run: python -m pytest prismpath/tests -q
      # The sandbox security + robustness gate. Exits non-zero on ANY code execution or uncaught
      # crash across ~23k adversarial + random predicate inputs. This is the check that guards the
      # "a `when` predicate cannot execute code, and cannot crash a run" claim in the papers.
      - name: Fuzz the predicate sandbox
        run: python -m prismpath.fuzz_predicates -n 20000

  # The conformance gate: the JS port must match the Python reference bit-for-bit on the FROZEN
  # vectors (portable/conformance/), and the committed vectors must match a fresh regeneration
  # from the live Python code (no silent reference drift). This is the check that guards the
  # "any implementation is provably interchangeable" claim.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: pip install numpy pytest
      - name: Port unit tests
        run: node --test prismpath/portable/prismpath.test.mjs
      - name: Editor grammar tier-classification tests
        run: node --test prismpath/editor/vscode/test/grammar.test.mjs
      - name: Frozen conformance vectors (port side)
        run: node prismpath/portable/run_vectors.mjs prismpath/portable/conformance
      - name: Crypto-agility proofs (JS twin, byte-for-byte vs the frozen fixtures)
        run: node prismpath/portable/run_crypto_agility.mjs
      - name: Frozen conformance vectors (reference-drift side)
        run: python -m pytest prismpath/tests/test_conformance_vectors.py -q

  # Docs gates (LEDGER_STANDARDS §7): the evidence ledger holds its schema, and the doc tree
  # has no dead links or brand residue. Blocking since the v2 overhaul brought both to zero.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Evidence-ledger lint (strict)
        run: python tools/ledger_lint.py docs/research/supporting-evidence.md --strict
      - name: Docs health (dead links, brand residue)
        run: python tools/docs_health.py
      - name: Arithmetic lint (recompute cross-artifact ratios)
        run: python tools/arith_lint.py --strict

  # Mission Control is an optional control-plane extra (FastAPI). The main test job installs numpy-only
  # and skips its tests (pytest.importorskip); this job installs the extra so the shipped control plane
  # is actually exercised in CI — a collection error here previously masked the WHOLE suite.
  mission_control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (numpy + control-plane extra)
        run: pip install numpy pytest fastapi httpx
      - name: Mission Control tests
        run: python -m pytest prismpath/tests/test_mission_control.py -q

  # The bounded adapters (adapters/*) are additive and arch-guard-isolated, each shipping its own test
  # suite. They are self-rooted — each adapter's tests put their own directory on sys.path — so a single
  # combined collection across adapters clashes; each adapter therefore runs as its own pytest invocation.
  # Install stays lean: the telemetry and fusion offline suites need only numpy + pytest. The fusion
  # bench's heavier extras (opentelemetry for the OTLP baseline, zstandard, cryptography) are lazy /
  # importorskip, so a bare numpy+pytest environment still passes — CI stays fast and offline.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install numpy pytest
      - name: Telemetry adapter tests
        run: python -m pytest adapters/telemetry -q
      - name: Fusion adapter tests
        run: python -m pytest adapters/fusion -q

  # The Rust crates: the P0 kernel port (prismpath-rs) and the 1-1 telemetry adapter port
  # (prismpath-telemetry-rs). ubuntu-latest ships a stable Rust toolchain, so no setup action is needed.
  # `cargo test` runs each test binary with its crate root as the working directory, so the telemetry
  # conformance tests resolve their ../adapters/telemetry/conformance/ relative paths — they load the SAME
  # frozen corpora as the Python adapter and prove decision-preservation + byte-identical wire output.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kernel crate (prismpath-rs)
        run: cargo test --manifest-path prismpath-rs/Cargo.toml -q
      - name: Telemetry port (prismpath-telemetry-rs) — frozen-corpus + byte-identity parity
        run: cargo test --manifest-path prismpath-telemetry-rs/Cargo.toml -q
      - name: Telemetry port clippy
        run: cargo clippy --manifest-path prismpath-telemetry-rs/Cargo.toml --all-targets -- -D warnings
      - name: Preflight tool (prismpath-preflight) — binary e2e incl. the string-coercion finding
        run: cargo test --manifest-path prismpath-preflight/Cargo.toml -q
      - name: Preflight tool clippy
        run: cargo clippy --manifest-path prismpath-preflight/Cargo.toml --all-targets -- -D warnings

  # Substrate gates — the software-reproducible hardware/kernel proofs, run in CI so they cannot rot
  # silently. They HAD rotted: the RTL testbench's corpus path bit-rotted on a repo-layout change and
  # nothing caught it; the C-target had a doubled `prismpath/prismpath/` path; and `make -C tb`
  # returned 0 even when a cocotb test FAILED (a fake gate). All three are fixed, and `make -C tb gate`
  # now fails the build on any cocotb failure. ubuntu-24.04 ships Verilator 5.020 — the exact version
  # the RTL was certified with (cocotb 1.9.2) — via apt, so the sim is reproducible here.
  substrates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (editable kernel pkg + sim/build toolchain)
        run: |
          pip install -e . cocotb==1.9.2
          sudo apt-get update
          sudo apt-get install -y verilator clang libbpf-dev
      - name: C target — certify against the frozen corpus (declared subset)
        run: make -C prismpath-hw cert
      - name: RTL sim — conformance + live-sensor replay (REAL gate; fails on any cocotb failure)
        run: make -C prismpath-hw/tb gate
      - name: Hardware evidence integrity — the OTS-anchored hashes must still match
        run: cd prismpath-hw/evidence && sha256sum -c SHA256SUMS
      - name: eBPF — build + host-side interp cross-check (124/124 vs the reference, no kernel needed)
        run: |
          make -C prismpath-ebpf
          python3 prismpath-ebpf/cert_corpus.py /tmp/cert_corpus.bin

  # In-kernel eBPF conformance via BPF_PROG_TEST_RUN (needs root + a BPF-capable kernel). Confirmed
  # green on GitHub-hosted ubuntu-24.04 runners (they provide sudo + /sys/kernel/btf + a recent kernel),
  # so it runs on every push/PR — catching the regression class the eBPF maintenance notes warn about
  # (a clang/kernel update reopening a verifier issue), which the reproducible-anywhere `substrates`
  # eBPF steps cannot see. Isolated job: if a hosted-runner change ever flakes it, demote back to dispatch.
  ebpf_kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          sudo apt-get update && sudo apt-get install -y clang libbpf-dev
      - name: Build eBPF target + a seed image
        run: |
          make -C prismpath-ebpf
          python3 prismpath-ebpf/cert_corpus.py /tmp/cert_corpus.bin
          python3 prismpath-ebpf/net_compile.py prismpath-ebpf/net_triage.md \
            prismpath-ebpf/build/seed.ppt prismpath-ebpf/build/seed.names
      - name: In-kernel corpus conformance (124/124, BPF_PROG_TEST_RUN)
        run: cd prismpath-ebpf && sudo ./loader build/seed.ppt certify /tmp/cert_corpus.bin
      - name: In-kernel Facet decode-plane cert (250/250 byte-identical + negative matrix)
        run: cd prismpath-ebpf && sudo -E env "PATH=$PATH" python3 facet_decode_cert.py
