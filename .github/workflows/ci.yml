name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The flow kernel needs only numpy at import time (sentence-transformers is lazy-loaded
      # inside the embedder and never touched by the test suite, which stubs all routing). So CI
      # stays fast and offline — no torch download — while still exercising the real code paths.
      # cryptography exercises the signing tier (policy packs); its tests importorskip so a
      # bare numpy+pytest environment still passes.
      - name: Install
        run: pip install numpy pytest cryptography
      - name: Unit tests (parser / predicates / router / engine / prefilter)
        run: python -m pytest prismpath/tests -q
      # The sandbox security + robustness gate. Exits non-zero on ANY code execution or uncaught
      # crash across ~23k adversarial + random predicate inputs. This is the check that guards the
      # "a `when` predicate cannot execute code, and cannot crash a run" claim in the papers.
      - name: Fuzz the predicate sandbox
        run: python -m prismpath.fuzz_predicates -n 20000

  # The conformance gate: the JS port must match the Python reference bit-for-bit on the FROZEN
  # vectors (portable/conformance/), and the committed vectors must match a fresh regeneration
  # from the live Python code (no silent reference drift). This is the check that guards the
  # "any implementation is provably interchangeable" claim.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: pip install numpy pytest
      - name: Port unit tests
        run: node --test prismpath/portable/prismpath.test.mjs
      - name: Editor grammar tier-classification tests
        run: node --test prismpath/editor/vscode/test/grammar.test.mjs
      - name: Frozen conformance vectors (port side)
        run: node prismpath/portable/run_vectors.mjs prismpath/portable/conformance
      - name: Frozen conformance vectors (reference-drift side)
        run: python -m pytest prismpath/tests/test_conformance_vectors.py -q

  # Mission Control is an optional control-plane extra (FastAPI). The main test job installs numpy-only
  # and skips its tests (pytest.importorskip); this job installs the extra so the shipped control plane
  # is actually exercised in CI — a collection error here previously masked the WHOLE suite.
  mission_control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (numpy + control-plane extra)
        run: pip install numpy pytest fastapi httpx
      - name: Mission Control tests
        run: python -m pytest prismpath/tests/test_mission_control.py -q

  # The bounded adapters (adapters/*) are additive and arch-guard-isolated, each shipping its own test
  # suite. They are self-rooted — each adapter's tests put their own directory on sys.path — so a single
  # combined collection across adapters clashes; each adapter therefore runs as its own pytest invocation.
  # Install stays lean: numpy + hypothesis (compliance property tests) + requests (soc SIEM client) +
  # jsonschema (compliance emit-doc validation, a lazy import inside emit.py). The compliance
  # semantic-retrieve path top-level-imports sentence-transformers, but no test exercises it, so the heavy
  # ML extra is deliberately left out — CI stays fast and offline, like the main test job.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install numpy pytest hypothesis requests jsonschema
      - name: Telemetry adapter tests
        run: python -m pytest adapters/telemetry -q
      - name: SOC adapter tests
        run: python -m pytest adapters/soc -q
      - name: Compliance adapter tests
        run: python -m pytest adapters/compliance -q
      - name: Fusion adapter tests
        run: python -m pytest adapters/fusion -q

  # The Rust crates: the P0 kernel port (prismpath-rs) and the 1-1 telemetry adapter port
  # (prismpath-telemetry-rs). ubuntu-latest ships a stable Rust toolchain, so no setup action is needed.
  # `cargo test` runs each test binary with its crate root as the working directory, so the telemetry
  # conformance tests resolve their ../adapters/telemetry/conformance/ relative paths — they load the SAME
  # frozen corpora as the Python adapter and prove decision-preservation + byte-identical wire output.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kernel crate (prismpath-rs)
        run: cargo test --manifest-path prismpath-rs/Cargo.toml -q
      - name: Telemetry port (prismpath-telemetry-rs) — frozen-corpus + byte-identity parity
        run: cargo test --manifest-path prismpath-telemetry-rs/Cargo.toml -q
      - name: Telemetry port clippy
        run: cargo clippy --manifest-path prismpath-telemetry-rs/Cargo.toml --all-targets -- -D warnings
