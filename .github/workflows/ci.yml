name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A push or pull request deselects the tests marked checkpoint (an exhaustive sweep whose seeded sample runs here
# anyway); the weekly schedule and a manual run are the checkpoint and run everything.
env:
  PYTEST_MARKER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'checkpoint or not checkpoint' || 'not checkpoint' }}

jobs:
  # The package promises Python 3.10 and newer. A push or pull request runs the whole suite at the two ends, 3.10 and
  # 3.12, and on 3.11 compiles every module and runs the kernel's own tests; the weekly checkpoint runs the whole suite
  # on all three. The job keeps one name per version, so the required checks are the same on every event.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      WHOLE_SUITE: ${{ matrix.python-version != '3.11' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # The flow kernel needs only numpy at import time (sentence-transformers is lazy-loaded
      # inside the embedder and never touched by the test suite, which stubs all routing). So CI
      # stays fast and offline — no torch download — while still exercising the real code paths.
      # cryptography exercises the signing tier (policy packs); its tests importorskip so a
      # bare numpy+pytest environment still passes.
      - name: Install
        run: pip install numpy pytest cryptography
      # The sandbox tests run commands under bubblewrap, and the proxied network states relay the proxy socket
      # with socat inside the sandbox; without these the tests skip, and the sandbox goes unchecked on x86_64.
      - name: Install the sandbox tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bubblewrap socat
      # One run of the suite. PRISMPATH_REQUIRE_LANDLOCK=1 makes a kernel without Landlock fail the Landlock tests
      # rather than skip them, and the JUnit report is what the three checks below read, so no test runs twice.
      - name: Unit tests (parser / predicates / router / engine / prefilter)
        if: ${{ env.WHOLE_SUITE == 'true' }}
        env:
          PRISMPATH_REQUIRE_LANDLOCK: "1"
        run: python -m pytest prismpath/tests -q -rs -m "$PYTEST_MARKER" --junitxml=/tmp/unit.xml
      - name: Every module compiles, and the kernel tests (3.11 between checkpoints)
        if: ${{ env.WHOLE_SUITE != 'true' }}
        run: |
          python -m compileall -q prismpath tools integrations adapters
          python -m pytest -q -rs -m "$PYTEST_MARKER" prismpath/tests/test_parser.py prismpath/tests/test_predicates.py \
            prismpath/tests/test_router.py prismpath/tests/test_router_cache_bound.py prismpath/tests/test_engine.py \
            prismpath/tests/test_engine_error_guard.py prismpath/tests/test_engine_surface_corpus.py \
            prismpath/tests/test_prefilter.py prismpath/tests/test_prefilter_shadow.py prismpath/tests/test_canon.py \
            prismpath/tests/test_canon2.py prismpath/tests/test_canonicalize.py prismpath/tests/test_canon_nonfinite.py \
            prismpath/tests/test_core_evidence.py
      # The sandbox tests run commands under bubblewrap; none may have been skipped.
      # The Landlock backend of the per call sandbox is the path a shell command
      # takes under `prismpath agent run` on this runner, where Ubuntu 24.04's AppArmor setting forbids a bwrap inside a bwrap,
      # so a Landlock test skipped for want of Landlock is as red as one that failed, and the two adversary tests must pass.
      # (The bubblewrap-nested tests of the same file skip on this runner by design.)
      # The launcher's shell child tests (the nested table, the adversary set) run under whichever per call backend works, so
      # on this runner they run under Landlock; a skip for want of any backend would leave them unchecked, so it fails here.
      - name: The sandbox, Landlock and per call backend tests ran rather than skipped
        if: ${{ !cancelled() && env.WHOLE_SUITE == 'true' }}
        shell: python
        run: |
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse("/tmp/unit.xml").iter("testcase"))
          def of(*files):
              return [c for c in cases if c.get("classname", "").rsplit(".", 1)[-1] in files]
          def skipped(case):
              node = case.find("skipped")
              return None if node is None else (node.get("message") or "") + (node.text or "")
          bad = []
          sandbox = of("test_sandbox_exec", "test_sandbox_net")
          bad += [f"skipped: {c.get('name')}" for c in sandbox if skipped(c) is not None]
          landlock = of("test_landlock_backend")
          bad += [f"skipped for want of Landlock: {c.get('name')}" for c in landlock if "no landlock" in (skipped(c) or "").lower()]
          for name in ("test_where_nesting_is_forced_off_the_call_runs_under_landlock_and_every_adversary_case_is_stopped",
                       "test_landlock_stops_every_adversary_case_and_still_works_inside_the_workspace"):
              hit = [c for c in landlock if c.get("name") == name]
              if not hit or any(c.find("failure") is not None or c.find("error") is not None or skipped(c) is not None for c in hit):
                  bad.append(f"did not pass: {name}")
          nested = of("test_agent_nested", "test_agent_adversary")
          bad += [f"skipped for want of a backend: {c.get('name')}" for c in nested
                  if "neither a nested bubblewrap nor landlock" in (skipped(c) or "").lower()]
          if not (sandbox and landlock and nested):
              bad.append(f"a file's tests are missing from the report ({len(sandbox)}, {len(landlock)}, {len(nested)})")
          print(f"sandbox {len(sandbox)}, landlock {len(landlock)}, nested and adversary {len(nested)} tests in the report")
          print("\n".join(bad) or "none skipped")
          sys.exit(1 if bad else 0)
      # The sandbox security + robustness gate. Exits non-zero on ANY code execution or uncaught
      # crash across ~23k adversarial + random predicate inputs. This is the check that guards the
      # "a `when` predicate cannot execute code, and cannot crash a run" claim in the papers.
      - name: Fuzz the predicate sandbox
        run: python -m prismpath.safety.fuzz_predicates -n 20000

  # The conformance gate: the JS port must match the Python reference bit-for-bit on the FROZEN
  # vectors (portable/conformance/), and the committed vectors must match a fresh regeneration
  # from the live Python code (no silent reference drift). This is the check that guards the
  # "any implementation is provably interchangeable" claim.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install
        run: pip install numpy pytest
      - name: Port unit tests
        run: node --test prismpath/portable/prismpath.test.mjs
      - name: Editor grammar tier-classification tests
        run: node --test prismpath/editor/vscode/test/grammar.test.mjs
      # The Mission Control client: its render functions, markup escaping and transport under node --test,
      # then its modules parsed as strict module code and its ids held to index.html (the API half of the
      # client contract needs FastAPI and runs in the mission_control job).
      - name: Mission Control client tests
        run: |
          node --test prismpath/mission_control/static/js/tests/*.test.mjs
          python -m pytest prismpath/tests/test_mission_control_client.py -q
      - name: Frozen conformance vectors (port side)
        run: node prismpath/portable/run_vectors.mjs prismpath/portable/conformance
      - name: Crypto-agility proofs (JS twin, byte-for-byte vs the frozen fixtures)
        run: node prismpath/portable/run_crypto_agility.mjs
      # The other four runners (capability, reach, Level M, P1) carried a parity claim that no test
      # and no workflow step ever ran. The pytest suite spawns node on each of them and regenerates
      # each corpus from the Python reference, so both sides of that claim are now checked here.
      - name: The four remaining JavaScript runners, through their pytest wrappers
        run: python -m pytest prismpath/tests/test_portable_runners.py -q
      - name: Frozen conformance vectors (reference-drift side)
        run: python -m pytest prismpath/tests/test_conformance_vectors.py -q

  # Docs gates (LEDGER_STANDARDS §7): the evidence ledger holds its schema, and the doc tree
  # has no dead links or brand residue. Blocking since the v2 overhaul brought both to zero.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The architecture guard compares a refactor branch's frozen paths with main, so it needs main's history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Evidence-ledger lint (strict)
        run: python tools/ledger_lint.py docs/research/supporting-evidence.md --strict
      - name: Docs health (dead links, brand residue)
        run: python tools/docs_health.py
      - name: Arithmetic lint (recompute cross-artifact ratios)
        run: python tools/arith_lint.py --strict
      - name: Architecture guard (core purity, declared paths, deprecated identifiers, vocabulary drift)
        run: python tools/arch_guard.py

  # The package as a user receives it: the wheel and the sdist are built, each installed into a clean
  # environment away from the checkout, and the supported workflows run from there. A repository test
  # can pass while an installed distribution lacks a runtime Markdown file, a browser asset or a
  # conformance corpus; this job is where that shows.
  installed_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build the wheel and the sdist
        run: |
          pip install build
          python -m build --outdir dist .
      - name: Install the wheel into a clean environment away from the checkout
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)[signing,control-plane,test]" httpx
      - name: Installed workflows, run from outside the checkout
        run: |
          cd /tmp && rm -rf smoke && mkdir smoke && cd smoke
          VENV_BIN=/tmp/wheel-venv/bin
          $VENV_BIN/python -c 'import prismpath; assert "site-packages" in prismpath.__file__, prismpath.__file__'
          $VENV_BIN/prismpath --help > /dev/null
          $VENV_BIN/prismpath init --template incident_severity > /dev/null
          $VENV_BIN/prismpath validate incident_severity.md
          $VENV_BIN/prismpath test incident_severity.md
          $VENV_BIN/prismpath verify incident_severity.md > /dev/null
          printf '{"data_at_risk": false, "user_facing": true, "error_rate": 7}\n{"data_at_risk": true, "user_facing": false, "error_rate": 0}\n' > sample.ndjson
          $VENV_BIN/python -m prismpath.telemetry.preflight incident_severity.md sample.ndjson --json preflight.json > /dev/null
          $VENV_BIN/python -c 'import json; assert json.load(open("preflight.json"))["events"] == 2'
          $VENV_BIN/python -c 'from prismpath.mission_control import app; import importlib.resources as resources; assert (resources.files("prismpath.mission_control") / "static" / "index.html").is_file(); assert (resources.files("prismpath.mission_control") / "static" / "vendor" / "cytoscape.min.js").is_file()'
      - name: Shipped test suite against the installed package
        run: cd /tmp && /tmp/wheel-venv/bin/python -m pytest --pyargs prismpath.tests prismpath.telemetry.tests -q -rs -p no:cacheprovider -m "not cross_language and ($PYTEST_MARKER)"
      - name: The sdist rebuilds and installs
        run: |
          rm -rf /tmp/sdist-work && mkdir /tmp/sdist-work && tar -xzf dist/*.tar.gz -C /tmp/sdist-work
          cd /tmp/sdist-work/prismpath-* && python -m build --outdir /tmp/dist-from-sdist . > /dev/null
          python -m venv /tmp/sdist-venv && /tmp/sdist-venv/bin/pip install /tmp/dist-from-sdist/*.whl > /dev/null
          cd /tmp && /tmp/sdist-venv/bin/prismpath --help > /dev/null

  # The product repository is this repository's export and nothing else (tools/export_clean.py): the
  # export must pass the checks the product ships, and the tools' own suite must pass here.
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy pytest build cryptography "setuptools>=77"   # case 99 builds a wheel with --no-isolation, which needs the backend installed
      - name: The maintenance suite, including the export
        run: python -m pytest tools/tests -q
      - name: Export the product tree and check it
        env:
          PYTHONDONTWRITEBYTECODE: "1"   # the tools also ignore bytecode; this keeps the tree as exported
        run: |
          python tools/export_clean.py --out /tmp/prismpath-tree
          cd /tmp/prismpath-tree
          python -m tools.check_boundary
          python -m tools.check_compatibility
          python -m tools.fixture_sync
          python -m tools.provenance check
          python -m tools.provenance check --research "$GITHUB_WORKSPACE"
          python -m build --outdir dist .
          python -m tools.check_boundary --wheel dist/*.whl --sdist dist/*.tar.gz

  # Mission Control is an optional control-plane extra (FastAPI). The main test job installs numpy-only
  # and skips its tests (pytest.importorskip); this job installs the extra so the shipped control plane
  # is actually exercised in CI — a collection error here previously masked the WHOLE suite.
  mission_control:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # the 3.10 floor covers the control plane too, not only the kernel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (numpy + control-plane extra)
        run: pip install numpy pytest fastapi httpx
      - name: Mission Control tests
        run: python -m pytest prismpath/tests/test_mission_control.py prismpath/tests/test_mission_control_session.py prismpath/tests/test_mission_control_audit.py prismpath/tests/test_mission_control_client.py prismpath/tests/test_mission_control_operating.py prismpath/tests/test_queue_event.py prismpath/tests/test_mission_control_authoring.py prismpath/tests/test_mission_control_feed.py prismpath/tests/test_mission_control_feed_routes.py prismpath/tests/test_mission_control_guide.py -q

  # The bounded adapters (adapters/*) are additive and arch-guard-isolated, each shipping its own test
  # suite. They are ordinary packages under the repository root now, imported by package path, so the
  # sys.path rooting this comment used to describe is gone. Each adapter still runs as its own pytest
  # invocation, so a red step names the adapter without anyone reading the log.
  # Install stays lean: the telemetry and fusion offline suites need only numpy + pytest. The fusion
  # bench's heavier extras (opentelemetry for the OTLP baseline, zstandard, cryptography) are lazy /
  # importorskip, so a bare numpy+pytest environment still passes — CI stays fast and offline.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install numpy pytest hypothesis cryptography jsonschema pyyaml requests
      - name: Facet wire (prismpath.telemetry) tests
        run: python -m pytest prismpath/telemetry -q
      - name: Fusion adapter tests
        run: python -m pytest adapters/fusion -q
      - name: Compliance adapter tests (the GRC layer; hypothesis for its property tests)
        run: python -m pytest adapters/compliance -q

  # The Rust crates: the P0 kernel port (prismpath-rs) and the 1-1 telemetry adapter port
  # (prismpath-telemetry-rs). ubuntu-latest ships a stable Rust toolchain, so no setup action is needed.
  # `cargo test` runs each test binary with its crate root as the working directory, so the telemetry
  # conformance tests resolve their ../prismpath/telemetry/conformance/ relative paths — they load the SAME
  # frozen corpora as the Python adapter and prove decision-preservation + byte-identical wire output.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Kernel crate (prismpath-rs)
        run: cargo test --manifest-path prismpath-rs/Cargo.toml -q
      - name: Telemetry port (prismpath-telemetry-rs) — frozen-corpus + byte-identity parity
        run: cargo test --manifest-path prismpath-telemetry-rs/Cargo.toml -q
      - name: Telemetry port clippy
        run: cargo clippy --manifest-path prismpath-telemetry-rs/Cargo.toml --all-targets -- -D warnings
      - name: Preflight tool (prismpath-preflight) — binary e2e incl. the string-coercion finding
        run: cargo test --manifest-path prismpath-preflight/Cargo.toml -q
      - name: Preflight tool clippy
        run: cargo clippy --manifest-path prismpath-preflight/Cargo.toml --all-targets -- -D warnings
      - name: Hot swap port (prismpath-hotswap-rs) — a pack signed on either runtime verifies on the other
        run: cargo test --manifest-path prismpath-hotswap-rs/Cargo.toml -q
      - name: Hot swap port clippy
        run: |
          cargo clippy --manifest-path prismpath-hotswap-rs/Cargo.toml --all-targets -- -D warnings
          # the library alone, as a dependent builds it: without the test-support feature its own tests turn on
          cargo build --manifest-path prismpath-hotswap-rs/Cargo.toml --lib
          cargo clippy --manifest-path prismpath-hotswap-rs/Cargo.toml --lib -- -D warnings
      - name: Hot swap port as a dev build (the dev-hatches feature, where an escape hatch works)
        run: |
          cargo test --manifest-path prismpath-hotswap-rs/Cargo.toml -q --features dev-hatches
          cargo clippy --manifest-path prismpath-hotswap-rs/Cargo.toml --all-targets --features dev-hatches -- -D warnings
      - name: Reflect bindings (prismpath-reflect-bindings) — bind, reading round trip, bind time failures
        run: cargo test --manifest-path prismpath-reflect-bindings/Cargo.toml -q
      - name: Reflect bindings clippy
        run: cargo clippy --manifest-path prismpath-reflect-bindings/Cargo.toml --all-targets -- -D warnings
      - name: Collector (prismpath-ebpf/collector) — recorded kernel frames, hostile input, the read only reach (the kernel half is in ebpf_kernel)
        run: cargo test --locked --manifest-path prismpath-ebpf/collector/Cargo.toml -q
      - name: Collector clippy
        run: cargo clippy --locked --manifest-path prismpath-ebpf/collector/Cargo.toml --all-targets -- -D warnings

  # The declared minimum supported Rust version, built rather than asserted. prismpath-rs, the telemetry
  # port and the preflight tool declare 1.82 (the newest standard library call they use is
  # Option::is_none_or, stable in 1.82). The hot swap port declares 1.85 because the committed Cargo.lock
  # resolves ed25519-dalek's zeroize and base64ct to releases written in edition 2024. Each crate is
  # checked with every target, including its tests, against the committed lockfile.
  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.82"
            crates: "-p prismpath-rs -p prismpath-telemetry-rs -p prismpath-preflight"
          - toolchain: "1.85"
            crates: "-p prismpath-hotswap-rs"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Declared rust-version matches the toolchain under test
        run: |
          for crate in ${{ matrix.crates }}; do
            [ "$crate" = "-p" ] && continue
            declared="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print({p["name"]: p["rust_version"] for p in json.load(sys.stdin)["packages"]}["'"$crate"'"])')"
            test "$declared" = "${{ matrix.toolchain }}" || { echo "$crate declares $declared, job builds ${{ matrix.toolchain }}"; exit 1; }
          done
      - name: Build every target at the declared minimum
        run: cargo check --locked --all-targets ${{ matrix.crates }}

  # The Rust crates and the Python reference check each other: the signed packs, the host and its crash
  # recovery, the deferral store, the cause registry, the worker contract, the engine surface and the wire
  # profiles run against a live Python, and PRISMPATH_REQUIRE_CROSS_LANGUAGE makes a leg that cannot find
  # one fail instead of skipping. The log is searched for each leg's closing line, so a test that never
  # ran is as red as one that failed.
  rust_cross_language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . numpy pytest cryptography
      - name: The Rust and Python hosts, packs and deferral stores check each other, and no leg may be skipped
        env:
          PRISMPATH_REQUIRE_CROSS_LANGUAGE: "1"
        run: |
          set -o pipefail
          export PRISMPATH_PYTHON="$(command -v python)"
          cargo test -p prismpath-hotswap-rs --test test_hotswap_conformance --test test_host_trace --test test_host_crash --test test_host_cross_language --test test_distribution_pep --test test_distribution_cross_language -- --nocapture 2>&1 | tee cross_language.log
          cargo test -p prismpath-rs --test test_connector file_deferral_store_is_cross_runtime -- --nocapture 2>&1 | tee -a cross_language.log
          cargo test -p prismpath-rs --test test_causes -- --nocapture 2>&1 | tee -a cross_language.log
          cargo test -p prismpath-rs --test test_contract --test test_engine_surface --test test_engine_cross_language --test test_parse_limits -- --nocapture 2>&1 | tee -a cross_language.log
          cargo test -p prismpath-telemetry-rs --test test_cross_language -- --nocapture 2>&1 | tee -a cross_language.log
          grep -q "bidirectional: Python verified the Rust-signed packs" cross_language.log
          grep -q "file deferral: cross-runtime round-trips both ways" cross_language.log
          grep -q "cross-language host: each runtime restored the other's active policy" cross_language.log
          grep -q "cross-language host: each runtime recovered the other's interrupted commit" cross_language.log
          grep -q "cross-language host: non ASCII log identical in both runtimes" cross_language.log
          grep -q "host trace: .* cases" cross_language.log
          grep -q "cross-language distribution: the Python controller accepted the Rust host PEP's records" cross_language.log
          grep -q "cross-language distribution: Rust read the Python host PEP's records of a release Rust sealed" cross_language.log
          grep -q "cross-language distribution: the Python controller accepted the Rust host PEP's refused and lapsed records" cross_language.log
          grep -q "engine cross language: .* scenarios" cross_language.log
          grep -q "cross-language telemetry: Python decoded, re-encoded, demultiplexed and replayed what Rust wrote" cross_language.log
          grep -q "cross-language telemetry: Rust decoded, re-encoded, demultiplexed and replayed what Python wrote" cross_language.log
          if grep -q SKIP cross_language.log; then echo "a cross language leg was skipped"; exit 1; fi

  # One summary of every frozen corpus against every implementation that consumes it. tools/run_corpora.py
  # checks its consumer table against the tree (a corpus with no decision, a consumer that no longer
  # names its corpus, an unreadable target) and then calls the same test targets the jobs above call,
  # printing one line per corpus and implementation. A new corpus without a consumer decision fails here.
  corpus_summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Install
        run: pip install -e . numpy pytest cryptography
      - name: Consumer table against the tree
        run: python tools/run_corpora.py --check
      - name: Every corpus against every implementation
        run: python tools/run_corpora.py

  # The Go kernel: the fourth language kernel, judged by the same frozen vectors.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Go kernel conformance
        run: cd prismpath-go && go test ./... -v

  # Substrate gates — the software-reproducible hardware/kernel proofs, run in CI so they cannot rot
  # silently. They HAD rotted: the RTL testbench's corpus path bit-rotted on a repo-layout change and
  # nothing caught it; the C-target had a doubled `prismpath/prismpath/` path; and `make -C tb`
  # returned 0 even when a cocotb test FAILED (a fake gate). All three are fixed, and `make -C tb gate`
  # now fails the build on any cocotb failure. ubuntu-24.04 ships Verilator 5.020 — the exact version
  # the RTL was certified with (cocotb 1.9.2) — via apt, so the sim is reproducible here.
  substrates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install (editable kernel pkg + sim/build toolchain)
        run: |
          pip install -e . cocotb==1.9.2 pytest cryptography
          sudo apt-get update
          sudo apt-get install -y verilator clang llvm libbpf-dev
      - name: C target — certify against the frozen corpus (declared subset)
        run: make -C prismpath-hw cert
      - name: C target, defined flows route as the engine does on lowered thresholds and absence
        run: python -m pytest prismpath/tests/test_field_definitions_tables.py -q -rs
      - name: RTL sim — conformance + live-sensor replay (REAL gate; fails on any cocotb failure)
        run: make -C prismpath-hw/tb gate
      # The step above used to be the only simulation CI ran, so the control plane, the pack loader,
      # the write mux, the field front end, the receipt chain, the button conditioner, the finale
      # datapath and the whole Zeckendorf codec suite were certified by hand only. The comment on
      # this job records that this exact class of rot has already bitten here once. Every one of
      # those testbenches now has a gate target through prismpath-hw/rtl-tb/gate.mk, so the loop
      # below runs them all. It loops over the Makefiles rather than naming them, so a testbench
      # added tomorrow is gated the day it lands; gate.mk is not a testbench and, not being named
      # Makefile.something, is not picked up as one.
      - name: RTL sim, every remaining testbench (rtl-tb and the codec bench), first red fails the job
        run: |
          for testbench_makefile in prismpath-hw/rtl-tb/Makefile.* \
                                    prismpath-hw/codec-bench/rtl-tb/Makefile \
                                    prismpath-hw/codec-bench/rtl-tb/Makefile.*; do
            make -C "$(dirname "$testbench_makefile")" -f "$(basename "$testbench_makefile")" gate || exit 1
          done
      - name: C++ embed (integrations/cpp) — the C target in process, 4568/4568 byte identical to the certified CLI
        run: |
          cmake -S integrations/cpp -B integrations/cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build integrations/cpp/build -j
          cd integrations/cpp && python gen_fixture.py && ./build/ppt_replay ../../prismpath-hw/demo/flows/hyst_band.ppt hyst_fixture.bin
      - name: cFS app (integrations/cfs) and F Prime guard (integrations/fprime), the policy, drift, kernel and receipt checks; the end to end runs skip without a staged cFS or an F Prime build
        run: python -m pytest integrations/cfs integrations/fprime -q
      - name: Evidence integrity — every artifact manifest in the tree still matches (snapshot manifests reported)
        run: python tools/evidence_check.py
      - name: eBPF — build every program and tool (xdp, net, decode plane, selector, a6 rewrite, host tools) + host-side interp cross-check (the frozen declared subset, 147/147 vs the reference, no kernel needed)
        run: |
          make -C prismpath-ebpf
          python3 prismpath-ebpf/cert_corpus.py /tmp/cert_corpus.bin
      - name: eBPF tables past the evaluator's bounds are refused where they are built and by the loader just built
        run: python -m pytest prismpath/tests/test_ebpf_table_limits.py -q -rs
      - name: The loader just built refuses to attach a network table that is not the one the host verified
        run: |
          set -o pipefail
          python -m pytest "prismpath/tests/test_net_from_policy.py::test_the_loaders_own_gate_refuses_a_table_that_is_not_the_one_the_host_verified" -q -rs | tee /tmp/loader_gate.txt
          ! grep -q "SKIPPED" /tmp/loader_gate.txt
      - name: eBPF evaluator at its bounds (stack 64, 4,000 word programs, 200 edge nodes) and every object within the modelled verifier limits, no kernel needed
        run: |
          python -m pytest prismpath/tests/test_ebpf_evaluator_bounds.py -q -rs
          python3 prismpath-ebpf/verifier_budget.py prismpath-ebpf/ppt_xdp.bpf.o prismpath-ebpf/ppt_net.bpf.o prismpath-ebpf/ppt_select.bpf.o prismpath-ebpf/a6/ppt_xdp.bpf.o prismpath-ebpf/facet_decode.bpf.o

  # In-kernel eBPF conformance via BPF_PROG_TEST_RUN (needs root + a BPF-capable kernel). Confirmed
  # green on GitHub-hosted ubuntu-24.04 runners (they provide sudo + /sys/kernel/btf + a recent kernel),
  # so it runs on every push/PR — catching the regression class the eBPF maintenance notes warn about
  # (a clang/kernel update reopening a verifier issue), which the reproducible-anywhere `substrates`
  # eBPF steps cannot see. Isolated job: if a hosted-runner change ever flakes it, demote back to dispatch.
  ebpf_kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e . pytest cryptography
          sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Build eBPF target + a seed image
        run: |
          make -C prismpath-ebpf
          python3 prismpath-ebpf/cert_corpus.py /tmp/cert_corpus.bin
          python3 prismpath-ebpf/cert_corpus.py --boundary /tmp/cert_boundary.bin
          python3 prismpath-ebpf/net_compile.py prismpath-ebpf/net_triage.md \
            prismpath-ebpf/build/seed.ppt prismpath-ebpf/build/seed.names
      # The loader's own gate and the dev-only bypass need the built loaders; formal.yml deselects them, so they run here,
      # and a skip for want of a loader is as red as a failure.
      - name: The loader refuses an unverified table, and only the dev loader takes the bypass
        run: |
          make -C prismpath-ebpf dev
          set -o pipefail
          python3 -m pytest -q -rs prismpath/tests/test_net_from_policy.py -k "loaders_own_gate_refuses or unverified_bypass_works_only_in_the_dev_loader" | tee /tmp/loader-gate.txt
          ! grep -q "SKIPPED" /tmp/loader-gate.txt
      - name: The verifier's limits as the repo models them, on the objects about to be loaded
        run: python3 prismpath-ebpf/verifier_budget.py prismpath-ebpf/ppt_xdp.bpf.o prismpath-ebpf/ppt_net.bpf.o prismpath-ebpf/ppt_select.bpf.o prismpath-ebpf/a6/ppt_xdp.bpf.o prismpath-ebpf/facet_decode.bpf.o
      - name: In-kernel corpus conformance (147/147, BPF_PROG_TEST_RUN)
        run: cd prismpath-ebpf && sudo ./loader build/seed.ppt certify /tmp/cert_corpus.bin
      - name: In-kernel boundary corpus (stack 64, programs to 4,000 words, 200 edge nodes; the verifier accepts the evaluator and it routes as the reference does)
        run: cd prismpath-ebpf && sudo ./loader build/seed.ppt certify /tmp/cert_boundary.bin
      - name: In-kernel Facet decode-plane cert (250/250 byte-identical + negative matrix)
        run: cd prismpath-ebpf && sudo -E env "PATH=$PATH" python3 facet_decode_cert.py
      - name: Real packet front end conformance (ppt_net, 90/90 frames against the host engine)
        run: |
          python3 prismpath-ebpf/net_cert.py /tmp/net_frames.bin
          cd prismpath-ebpf && sudo ./loader x netcert /tmp/net_frames.bin
      - name: The collector against the governed net program on lo (pinned maps and ring buffer, CAP_BPF alone under its systemd unit, the read only feed)
        run: |
          cargo build --release --locked --manifest-path prismpath-ebpf/collector/Cargo.toml
          sudo -E env "PATH=$PATH" bash prismpath-ebpf/collector/kernel_test.sh

  # The comparison glue against a real OPA: the receipt sink and the revision floor tests skip wherever the
  # pinned comparator toolchain is absent, which used to be every CI run. This job installs the toolchain
  # (pinned versions, published checksums; cedar skipped, it needs a cargo build) so those tests run.
  comparisons_glue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install (kernel + the pinned comparators)
        run: |
          pip install numpy pytest cryptography
          bash prismpath/comparisons/toolchain/install.sh --skip-cedar
      - name: Toolchain pins and the OPA glue (receipt sink, revision floor)
        run: python -m pytest prismpath/tests/test_comparisons_toolchain.py prismpath/tests/test_glue_opa_receipts.py prismpath/tests/test_glue_opa_revision_floor.py -q -rs
