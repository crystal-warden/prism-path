name: formal

# The Lean 4 development proving Figueroa quantization (formal/). Mathlib's cache is large, so this
# runs only when formal/, the corpora it bridges to, or the reference code it compares against change,
# and on demand. Gate: every module builds,
# every #guard bridge check evaluates, the axiom audit prints, and no sorry exists in the sources.
on:
  push:
    branches: [main]
    paths: ["formal/**", "prismpath/telemetry/conformance/**", "prismpath/portable/conformance/**",
            "prismpath/telemetry/quantizer.py", "prismpath/kernel/**", "prismpath/agent/**",
            "integrations/governed_harness/**", "prismpath/tests/fixtures/claude_code_hooks.json",
            ".github/workflows/formal.yml"]
  pull_request:
    paths: ["formal/**", "prismpath/telemetry/conformance/**", "prismpath/portable/conformance/**",
            "prismpath/telemetry/quantizer.py", "prismpath/kernel/**", "prismpath/agent/**",
            "integrations/governed_harness/**", "prismpath/tests/fixtures/claude_code_hooks.json",
            ".github/workflows/formal.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install elan (the Lean toolchain manager); the toolchain version comes from formal/lean-toolchain
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: cd formal && lake exe cache get
      - name: Build (modules, #guard bridge checks, axiom audit)
        run: cd formal && lake build
      - name: The core oracle runs on the specification's example
        run: |
          cd formal
          printf '%s' '{"fields":{"x":"int min=0 max=10"},"format":"prismpath.core/1","rules":[{"target":"hit","when":["cmp","x",">=",["num",5]]}]}' > /tmp/core_policy.json
          printf '%s' '{"x":7}' > /tmp/core_r1.json
          printf '%s' '{"x":11}' > /tmp/core_r2.json
          .lake/build/bin/core-oracle /tmp/core_policy.json /tmp/core_r1.json /tmp/core_r2.json | tee /tmp/core_out.txt
          grep -q '"target":"hit"' /tmp/core_out.txt
          grep -q '"reason":"out_of_range"' /tmp/core_out.txt
          printf '%s' '{"x": 7}' > /tmp/core_r3.json
          .lake/build/bin/core-oracle /tmp/core_policy.json /tmp/core_r3.json | grep -q '"cause":"reading:not-canonical"'
      - name: The differential harness, CI size (oracle, Python reference, Rust port, JS, Go, C and eBPF legs), and a run as evidence verified across languages
        run: |
          pip install pytest cryptography
          PRISMPATH_REQUIRE_CORE_ORACLE=1 python -m pytest prismpath/tests/test_core_diff.py prismpath/tests/test_core_evidence.py -q
      # The egress policy and edge table tests hold the compiled net state and the destination table to the same oracle; they
      # need a C compiler (cc, present on the runner) for the in-kernel evaluator. Required, so a skip is a failure.
      - name: The egress policy and the edge table agree with the oracle, and no case may be skipped
        run: |
          set -o pipefail
          PRISMPATH_REQUIRE_CORE_ORACLE=1 python -m pytest prismpath/tests/test_egress_policy.py prismpath/tests/test_net_from_policy.py -q -rs --deselect prismpath/tests/test_net_from_policy.py::test_the_loaders_own_gate_refuses_a_table_that_is_not_the_one_the_host_verified | tee /tmp/egress.txt
          ! grep -q "SKIPPED" /tmp/egress.txt
      - name: The classifier differential harness (docs/design/spec-verified-classifier.md), CI size and the full 20,000 call run
        run: |
          PRISMPATH_REQUIRE_CLASSIFIER_ORACLE=1 python -m pytest prismpath/tests/test_classifier_diff.py -q
          python formal/diff/classifier_diff.py --cases 20000 --seed 1
      - name: No sorry in the sources
        run: "! grep -rn --include=*.lean -w sorry formal/FQ formal/FQ.lean formal/Core formal/Core.lean formal/Classifier formal/Classifier.lean"
      - name: Bridge vectors are byte identical to a fresh generation from the frozen corpora
        run: |
          pip install numpy
          cp formal/FQ/Vectors.lean /tmp/Vectors.before.lean
          python formal/gen_vectors.py
          diff -q /tmp/Vectors.before.lean formal/FQ/Vectors.lean
