[package]
name = "prismpath-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "PrismPath P0 engine in native Rust: a decidable Markdown policy runtime (Level M match-action)."
license = "Apache-2.0"
repository = "https://github.com/crystal-warden/prism-path"
keywords = ["policy", "control-plane", "decidable", "match-action", "embedded"]
categories = ["algorithms", "embedded"]

[features]
# `durable` = checkpoint/resume + the content-addressed attestation manifests (sha2/hmac are tiny,
# pure-Rust). Default-on so the conformance gate always runs; embedded builds that want the bare
# kernel use `default-features = false` and keep only serde.
default = ["durable"]
durable = ["merkle", "dep:sha2", "dep:hmac", "dep:hex"]
# `merkle` = the RFC 6962 tree every ledger shares (sha2 and hex only), for crates that need the tree
# without the rest of `durable`, such as the telemetry transport.
merkle = ["dep:sha2", "dep:hex"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip"] }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }
